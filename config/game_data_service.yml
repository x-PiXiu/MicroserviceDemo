# =============================================================================
# 游戏数据服务配置文件 - 重构版本
# 版本: 1.0.0
# 日期: 2025-09-20
# 说明: 基于http_config.yml格式的统一配置结构
# =============================================================================

# ==================== 服务基础配置 ====================
service:
  name: "game_data_service"
  version: "1.0.0"
  description: "游戏数据服务 - 管理跨游戏数据"
  environment: "development"

# ==================== 网络配置 ====================
network:
  host: "0.0.0.0"
  port: 8084
  worker_threads: 4
  io_threads: 2
  max_connections: 1000
  connection_timeout: 30
  keep_alive_timeout: 30
  send_buffer_size: 1024
  recv_buffer_size: 1024
  read_timeout: 60
  write_timeout: 60
  backlog: 1024
  reuse_address: true
  tcp_no_delay: true
  keep_alive: true
  enable_epoll: true

# ==================== 数据库配置 ====================
mysql:
  # --- 基础连接信息 ---
  host: "127.0.0.1"                   # MySQL 服务器主机名或IP地址
  port: 3306                          # MySQL 服务端口
  username: "root"                    # 登录用户名
  password: "013ee244b29700ed"                  # 登录密码（生产环境建议使用密钥管理或环境变量）
  database: "game_service_db"         # 默认连接的数据库名
  charset: "utf8mb4"                  # 客户端字符集（推荐 utf8mb4 支持 Emoji 和完整 Unicode）
  collation: "utf8mb4_general_ci"     # 字符校对规则（区分大小写、排序规则等）

  # --- 连接池配置 ---
  pool:
    initial_size: 5                   # 启动时初始化的连接数
    max_size: 20                      # 连接池最大连接数（超过将等待或拒绝）
    min_size: 2                       # 连接池保持的最小空闲连接数
    max_idle: 10                      # 最大空闲连接数（超过将被回收）
    max_wait_time: 5000               # 获取连接的最大等待时间（毫秒），超时抛异常
    max_idle_time_ms: 600000          # 连接最大空闲时间（毫秒），超时自动回收（10分钟）
    validation_query: "SELECT 1"      # 用于验证连接是否有效的SQL语句
    validation_interval_ms: 30000     # 空闲连接检测间隔（毫秒，30秒）
    test_on_borrow: true              # 借出连接前是否验证有效性
    test_on_return: false             # 归还连接时是否验证有效性
    test_while_idle: true             # 空闲时是否定期验证连接有效性

  # ========== 适配代码配置键名 ==========

  # --- 连接与重连参数 ---
  mysql_connect_timeout_ms: 5000      # 连接超时时间（毫秒），0表示无限等待
  mysql_read_timeout_ms: 5000         # 读取数据超时时间（毫秒）
  mysql_write_timeout_ms: 5000        # 写入数据超时时间（毫秒）
  mysql_auto_reconnect: true          # 是否自动重连（断开后尝试恢复）
  mysql_max_reconnect_attempts: 3     # 最大重连尝试次数
  mysql_reconnect_interval_ms: 1000   # 重连间隔时间（毫秒）

  # --- SSL 安全连接配置 ---
  mysql_use_ssl: false                # 是否启用 SSL 加密连接
  mysql_ssl_ca: ""                    # CA 证书路径（用于验证服务端证书）
  mysql_ssl_cert: ""                  # 客户端证书路径（双向认证时使用）
  mysql_ssl_key: ""                   # 客户端私钥路径（双向认证时使用）
  mysql_ssl_cipher: ""                # 指定加密套件（如 "AES256-SHA"）
  mysql_ssl_verify_server_cert: false # 是否验证服务端证书域名（生产环境建议开启）

  # --- 性能调优参数 ---
  mysql_max_allowed_packet: 67108864  # 最大允许的包大小（字节），默认 64MB，防止大数据包失败
  mysql_net_buffer_length: 16384      # 网络缓冲区初始大小（字节），默认 16KB
  mysql_compress: false               # 是否启用网络传输压缩（节省带宽，增加CPU开销）
  mysql_init_command: ""              # 连接建立后执行的初始化SQL（如 "SET time_zone='+08:00'"）

  # --- 事务与隔离级别配置 ---
  mysql_isolation_level: "REPEATABLE-READ"  # 事务隔离级别：READ-UNCOMMITTED, READ-COMMITTED, REPEATABLE-READ, SERIALIZABLE
  mysql_autocommit: true              # 是否自动提交事务（false 时需手动 commit/rollback）
  mysql_lock_wait_timeout: 50000      # 行锁等待超时时间（毫秒），默认 50 秒，超时抛 Lock wait timeout 错误

# ==================== Redis 配置 ====================
redis:
  # --- 基础连接信息 ---
  host: "127.0.0.1"                       # Redis 服务器主机名或IP地址
  port: 6379                          # Redis 服务端口
  password: "123456"                  # 认证密码（生产环境建议使用密钥管理）
  database: 3                         # 使用的数据库编号（0-15，默认0）

  # --- 连接池配置 ---
  pool_size: 5                        # 初始连接池大小（启动时创建）
  max_pool_size: 20                   # 最大连接数（超过将等待或拒绝）
  min_pool_size: 2                    # 最小空闲连接数（维持连接保活）
  pool_timeout_ms: 5000               # 获取连接最大等待时间（毫秒）
  pool_max_idle_time_ms: 600000       # 连接最大空闲时间（毫秒，10分钟超时回收）
  pool_test_on_borrow: true           # 借出前是否测试连接有效性
  pool_test_on_return: false          # 归还时是否测试连接有效性
  # test_while_idle: true             # （保留）空闲时是否测试（代码未使用，可选保留）

  # --- 连接超时与网络参数 ---
  connect_timeout_ms: 2000            # 建立连接超时时间（毫秒）
  socket_timeout_ms: 3000             # Socket 读写超时（毫秒）
  command_timeout_ms: 3000            # 单条命令执行超时（毫秒）
  tcp_keepalive: false                # 是否启用 TCP KeepAlive
  tcp_keepalive_idle: 60              # KeepAlive 空闲时间（秒）
  tcp_keepalive_interval: 30          # KeepAlive 探测间隔（秒）
  tcp_keepalive_count: 3              # KeepAlive 探测失败次数上限

  # --- 重连与重试机制 ---
  auto_reconnect: true                # 连接断开后是否自动重连
  max_reconnect_attempts: 3           # 最大重连尝试次数
  reconnect_interval_ms: 1000         # 重连间隔（毫秒）
  retry_attempts: 2                   # 命令失败后重试次数
  retry_delay_ms: 500                 # 命令重试间隔（毫秒）

  # --- 集群模式配置 ---
  cluster_enabled: false              # 是否启用 Redis Cluster 模式
  cluster_max_redirections: 5         # 最大重定向次数（避免无限循环）
  cluster_require_full_coverage: true # 是否要求所有哈希槽都可用才接受请求

  # --- 哨兵模式配置 ---
  sentinel_enabled: false             # 是否启用 Redis Sentinel 高可用模式
  sentinel_master_name: "mymaster"    # Sentinel 监控的主节点名称
  sentinel_password: ""               # Sentinel 认证密码（如配置了 requirepass）
  sentinel_timeout_ms: 5000           # Sentinel 连接超时（毫秒）

  # --- SSL/TLS 安全连接 ---
  use_ssl: false                      # 是否启用 SSL/TLS 加密连接
  ssl_cert_file: ""                   # 客户端证书文件路径（双向认证）
  ssl_key_file: ""                    # 客户端私钥文件路径
  ssl_ca_file: ""                     # CA 证书路径（用于验证服务端）
  ssl_verify_peer: false              # 是否验证服务端证书有效性
  ssl_ciphers: ""                     # 指定加密套件（如 "AES256-SHA"）

  # --- 性能优化配置 ---
  pipeline_size: 10                   # 管道批量操作的默认大小
  enable_pipeline: false              # 是否默认启用管道（批量命令优化）
  max_memory_policy: 0                # 内存淘汰策略（0=默认 noeviction，1=allkeys-lru...）
  compress_data: false                # 是否压缩存储的数据（节省内存，增加CPU开销）

  # --- 业务缓存 TTL 配置（非驱动层，业务层使用）---
  cache:
    default_ttl: 300                  # 默认缓存过期时间（秒）
    user_info_ttl: 300                # 用户基本信息缓存过期时间（秒）
    user_profile_ttl: 600             # 用户档案缓存过期时间（秒）
    user_preferences_ttl: 1800        # 用户偏好设置缓存过期时间（秒）

# ==================== 线程池配置 ====================
thread_pool:
  # --- 核心参数 ---
  core_size: 4                        # 核心线程数（即使空闲也会保留）
  max_size: 16                        # 最大线程数（任务堆积时可临时扩展至此数量）
  keep_alive_ms: 60000                # 非核心线程空闲存活时间（毫秒，60秒后回收）
  queue_capacity: 1024                # 任务队列容量（超过则触发拒绝策略）

  # --- 行为策略 ---
  allow_core_timeout: false           # 是否允许核心线程超时退出（false=永不退出）
  rejection_policy: "abort"           # 任务拒绝策略：abort（抛异常）, caller_runs, discard, discard_oldest
  prestart_core_threads: false        # 是否在启动时预创建所有核心线程（true=立即创建，false=按需创建）

  # --- 线程属性 ---
  thread_priority: 5                  # 线程优先级（1~10，5=正常，越高CPU调度越频繁）
  name_prefix: "game-data-service-"        # 线程名称前缀，便于调试和监控（如 "user-service-1"）

  # --- 监控配置 ---
  enable_monitoring: false            # 是否启用线程池运行时监控（如队列大小、活跃线程数等）
  monitoring_interval_ms: 5000        # 监控日志/指标采集间隔（毫秒，5秒）

# ==================== 安全配置 ====================
security:
  authentication:
    enabled: true
    token_verification_url: "http://127.0.0.1:8083/api/v1/auth/validate"
    cache_tokens: true
    token_cache_ttl: 300
  rate_limiting:
    enabled: true
    requests_per_minute: 2000
    requests_per_hour: 20000
    burst_size: 200
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization", "X-Requested-With"]
    max_age: 3600

# ==================== 游戏数据配置 ====================
game_data:
  games:
    id: 1
    name: "gomoku"
    display_name: "五子棋"
    initial_rating: 1200
    max_rating: 3000
    min_rating: 100
  rating:
    elo_k_factor: 32
    rating_floor: 100
    provisional_games: 10
  experience:
    base_exp_per_game: 10
    win_bonus_multiplier: 2.0
    loss_penalty: 0.5
    draw_multiplier: 1.0
    max_level: 100
    exp_formula: "quadratic"
  currency:
    default_gold: 1000
    default_gems: 10
    max_gold: 999999999
    max_gems: 99999
  inventory:
    max_items_per_type: 999
    auto_cleanup_expired: true
    cleanup_interval_hours: 24

# ==================== 功能开关配置 ====================
# 注意：这些配置控制各子系统的启用状态
features:
  achievements:
    enable: true                    # 是否启用成就系统
  ranking:
    enable: true                    # 是否启用排行榜系统
  inventory:
    enable: true                    # 是否启用库存系统
  currency:
    enable: true                    # 是否启用货币系统

# ==================== 定时器配置 ====================
timers:
  cache_cleanup_interval_minutes: 30        # 缓存清理间隔（分钟）
  data_archival_interval_hours: 24          # 数据归档间隔（小时）
  achievement_update_interval_minutes: 15   # 成就更新间隔（分钟）
  ranking_update_interval_minutes: 10       # 排行榜更新间隔（分钟）
  inventory_cleanup_interval_hours: 6       # 库存清理间隔（小时）
  currency_audit_interval_hours: 12         # 货币审计间隔（小时）
  status_log_interval_minutes: 5            # 状态日志间隔（分钟）

# ==================== 性能配置 ====================
performance:
  max_concurrent_players: 1000              # 最大并发玩家数

# ==================== 缓存配置 ====================
cache:
  enable_cleanup: true                      # 是否启用缓存清理
  expire_seconds: 3600                      # 缓存过期时间（秒）

# ==================== 数据管理配置 ====================
data_management:
  enable_archival: true                     # 是否启用数据归档

# ==================== 业务规则配置 ====================
business_rules:
  max_achievements_per_player: 500          # 每玩家最大成就数
  max_inventory_items: 200                  # 最大库存物品数
  currency_transfer_daily_limit: 10000.0    # 货币每日转账限制
  ranking_top_players_count: 100            # 排行榜显示前N名

# ==================== 成就系统配置 ====================
achievements:
  enabled: true
  auto_unlock: true
  notification_enabled: true
  categories:
    - "gameplay"
    - "progression"
    - "social"
    - "special"
  rarity_multipliers:
    common: 1.0
    rare: 1.5
    epic: 2.0
    legendary: 3.0
  unlock_rewards:
    common: 10
    rare: 25
    epic: 50
    legendary: 100

# ==================== 排行榜配置 ====================
leaderboards:
  enabled: true
  types:
    - "rating"
    - "wins"
    - "playtime"
    - "win_streak"
  update_frequency: 300
  max_entries: 1000
  cache_duration: 600
  seasons:
    enabled: true
    current_season: "season_2025_1"
    season_duration_days: 90

# ==================== 排行榜调度器配置 ====================
# 用于自动重置周榜/月榜
leaderboard_scheduler:
  enabled: true                       # 是否启用排行榜调度器
  interval_seconds: 3600              # 检查间隔（秒），1小时检查一次

  # --- 周榜重置配置 ---
  weekly:
    enabled: true                     # 是否启用周榜重置
    reset_day: 1                      # 重置日（1=周一, 7=周日）
    reset_hour: 0                     # 重置时间（小时，0-23）
    reset_minute: 0                   # 重置时间（分钟，0-59）
    timezone: "Asia/Shanghai"         # 时区
    archive_before_reset: true        # 重置前是否归档

  # --- 月榜重置配置 ---
  monthly:
    enabled: true                     # 是否启用月榜重置
    reset_day: 1                      # 重置日（每月第几天）
    reset_hour: 0                     # 重置时间（小时）
    reset_minute: 0                   # 重置时间（分钟）
    timezone: "Asia/Shanghai"         # 时区
    archive_before_reset: true        # 重置前是否归档

  # --- 赛季榜重置配置 ---
  seasonal:
    enabled: true                     # 是否启用赛季榜重置
    duration_days: 90                 # 赛季持续天数
    notify_before_days: 7             # 提前几天通知

# ==================== 游戏插件配置 ====================
# 用于多游戏扩展架构
game_plugins:
  enabled: true                       # 是否启用游戏插件系统
  auto_load: true                     # 是否自动加载插件
  plugin_directory: "plugins"         # 插件目录路径

  # --- 已注册的游戏 ---
  games:
    gomoku:
      enabled: true                   # 是否启用五子棋
      id: "gomoku"                    # 游戏ID
      name: "五子棋"                   # 游戏名称
      class: "GomokuPlugin"           # 插件类名
      version: "1.0.0"                # 版本号
      category: "BOARD"               # 游戏类别
      player_range: [2, 2]            # 玩家数量范围
      rating_config:
        initial_rating: 1200
        min_rating: 100
        max_rating: 3000
        k_factor_new: 32
        k_factor_stable: 16
        provisional_games: 10

    # 未来可扩展的游戏（预留配置）
    chess:
      enabled: false                  # 未启用
      id: "chess"
      name: "中国象棋"
      class: "ChessPlugin"
      category: "BOARD"
      player_range: [2, 2]

    go:
      enabled: false                  # 未启用
      id: "go"
      name: "围棋"
      class: "GoPlugin"
      category: "BOARD"
      player_range: [2, 2]

# ==================== 游戏回放配置 ====================
# 用于游戏录制和回放功能
replay:
  enabled: true                       # 是否启用回放系统
  storage_path: "data/replays"        # 回放存储路径
  max_replays_per_user: 100           # 每用户最大回放数
  max_replay_age_days: 30             # 回放保留天数
  max_replay_size_bytes: 10485760     # 单个回放最大大小（10MB）
  compress_replays: true              # 是否压缩回放数据
  compression_level: 6                # 压缩级别（1-9）

  # --- 录制配置 ---
  recording:
    auto_record: true                 # 是否自动录制
    record_chat: false                # 是否录制聊天
    record_spectators: false          # 是否录制观战者数据

  # --- 播放配置 ---
  playback:
    default_speed: 1.0                # 默认播放速度
    available_speeds: [0.5, 1.0, 1.5, 2.0]  # 可用播放速度
    step_by_step: true                # 是否支持逐步播放

# ==================== 日志配置 ====================
logger:
  console:
    enabled: true
  file:
    enabled: true
    path: "logs/game_data_service.log"
    max_size: 536870912    # 512 * 1024 * 1024 = 512 MB
    max_files: 5
  async:
    enabled: false
  level: "INFO"

# ==================== 服务注册中心配置 ====================
service_registry:
  enabled: true                       # 是否启用服务注册
  host: "127.0.0.1"                   # 服务注册中心地址
  port: 8090                          # 服务注册中心端口
  heartbeat_interval_s: 30            # 心跳间隔（秒）
  register_timeout_s: 10              # 注册超时（秒）
  request_timeout_ms: 5000            # 请求超时（毫秒）
  auto_heartbeat: true                # 自动发送心跳
  auto_reconnect: true                # 自动重新注册
  reconnect_delay_s: 5                # 重连延迟（秒）
  # 服务元数据
  metadata:
    service_type: "core"              # 服务类型：core, game, gateway
    region: "cn-east"                 # 区域

# ==================== 监控配置 ====================
monitoring:
  enabled: true
  metrics:
    enabled: true
    port: 9083
    path: "/metrics"
  health_check:
    enabled: true
    path: "/api/v1/gamedata/health"
    interval: 30
    timeout: 5
  performance:
    track_requests: true
    track_database_queries: true
    track_cache_operations: true
    slow_query_threshold: 1000

# ==================== 业务配置 ====================
business:
  game_results:
    auto_process_rewards: true
    auto_update_achievements: true
    auto_update_leaderboards: true
    batch_processing: true
    batch_size: 100
  currency_operations:
    enable_transaction_log: true
    max_single_transaction: 1000000
    daily_earn_limit: 100000
    fraud_detection: true
  inventory_management:
    auto_stack_items: true
    auto_remove_expired: true
    max_unique_items: 1000
  social_features:
    friend_requests: true
    leaderboard_sharing: true
    achievement_sharing: true

# ==================== JWT 认证配置 ====================
# 注意：此配置必须与 auth_service 中的 JWT 配置保持一致
jwt:
  # 注意：此 secret_key 必须与 auth_service_config.yml 中的 jwt.secret_key 完全一致
  secret_key: "${JWT_SECRET_KEY:game_microservices_jwt_secret_key_2025_very_secure}"
  issuer: "game-microservices-auth"           # 令牌发行者（必须与 auth_service 一致）
  audience: "game-microservices-clients"      # 令牌受众
  algorithm: "HS256"                          # 签名算法
  clock_skew_seconds: 60                      # 时钟偏差容忍（秒）
  validate_issuer: true                       # 是否验证发行者
  validate_audience: false                    # 是否验证受众
  validate_expiration: true                   # 是否验证过期时间

# ==================== 认证中间件配置 ====================
auth_middleware:
  enabled: true                               # 是否启用认证中间件
  token_header: "Authorization"               # Token 头部名称
  token_prefix: "Bearer "                     # Token 前缀
  # 不需要认证的路径（前缀匹配）
  exclude_paths:
    - "/health"
    - "/info"
    - "/stats"
    - "/api/v1/gamedata/health"

# ==================== 环境配置 ====================
development:
  debug_mode: true
  mock_external_services: false
  enable_cors: true
  log_all_requests: true
  database:
    show_sql: true
    log_slow_queries: true
  cache:
    disable_for_testing: false
  achievements:
    instant_unlock: false

testing:
  debug_mode: false
  database:
    use_test_db: true
    reset_data_on_start: true
  cache:
    use_memory_cache: true
  external_services:
    mock_auth_service: true
    mock_user_service: true
  achievements:
    fast_unlock: true

production:
  debug_mode: false
  security:
    enforce_https: true
    strict_cors: true
    enable_audit_log: true
  database:
    use_read_replicas: true
    enable_connection_pooling: true
