# =============================================================================
# 用户核心服务配置文件 - 重构版本
# 版本: 1.0.0
# 日期: 2025-09-20
# 说明: 基于http_config.yml格式的统一配置结构
# =============================================================================

# ==================== 服务基础配置 ====================
service:
  name: "user_service"
  version: "1.0.0"
  description: "用户核心服务 - 管理用户基础数据"
  environment: "development"

# ==================== 网络配置 ====================
network:
  host: "0.0.0.0"
  port: 8082
  worker_threads: 4
  io_threads: 2
  max_connections: 1000
  connection_timeout: 30
  keep_alive_timeout: 30
  send_buffer_size: 1024
  recv_buffer_size: 1024
  read_timeout: 60
  write_timeout: 60
  backlog: 1024
  reuse_address: true
  tcp_no_delay: true
  keep_alive: true
  enable_epoll: true

# ==================== 数据库配置 ====================
mysql:
  # --- 基础连接信息 ---
  host: "dev-mysql"                   # MySQL 服务器主机名或IP地址
  port: 3306                          # MySQL 服务端口
  username: "root"                    # 登录用户名
  password: "123456"                  # 登录密码（生产环境建议使用密钥管理或环境变量）
  database: "user_service_db"         # 默认连接的数据库名
  charset: "utf8mb4"                  # 客户端字符集（推荐 utf8mb4 支持 Emoji 和完整 Unicode）
  collation: "utf8mb4_general_ci"     # 字符校对规则（区分大小写、排序规则等）

  # --- 连接池配置 ---
  pool:
    initial_size: 5                   # 启动时初始化的连接数
    max_size: 20                      # 连接池最大连接数（超过将等待或拒绝）
    min_size: 2                       # 连接池保持的最小空闲连接数
    max_idle: 10                      # 最大空闲连接数（超过将被回收）
    max_wait_time: 5000               # 获取连接的最大等待时间（毫秒），超时抛异常
    max_idle_time_ms: 600000          # 连接最大空闲时间（毫秒），超时自动回收（10分钟）
    validation_query: "SELECT 1"      # 用于验证连接是否有效的SQL语句
    validation_interval_ms: 30000     # 空闲连接检测间隔（毫秒，30秒）
    test_on_borrow: true              # 借出连接前是否验证有效性
    test_on_return: false             # 归还连接时是否验证有效性
    test_while_idle: true             # 空闲时是否定期验证连接有效性

  # ========== 适配代码配置键名 ==========

  # --- 连接与重连参数 ---
  mysql_connect_timeout_ms: 5000      # 连接超时时间（毫秒），0表示无限等待
  mysql_read_timeout_ms: 5000         # 读取数据超时时间（毫秒）
  mysql_write_timeout_ms: 5000        # 写入数据超时时间（毫秒）
  mysql_auto_reconnect: true          # 是否自动重连（断开后尝试恢复）
  mysql_max_reconnect_attempts: 3     # 最大重连尝试次数
  mysql_reconnect_interval_ms: 1000   # 重连间隔时间（毫秒）

  # --- SSL 安全连接配置 ---
  mysql_use_ssl: false                # 是否启用 SSL 加密连接
  mysql_ssl_ca: ""                    # CA 证书路径（用于验证服务端证书）
  mysql_ssl_cert: ""                  # 客户端证书路径（双向认证时使用）
  mysql_ssl_key: ""                   # 客户端私钥路径（双向认证时使用）
  mysql_ssl_cipher: ""                # 指定加密套件（如 "AES256-SHA"）
  mysql_ssl_verify_server_cert: false # 是否验证服务端证书域名（生产环境建议开启）

  # --- 性能调优参数 ---
  mysql_max_allowed_packet: 67108864  # 最大允许的包大小（字节），默认 64MB，防止大数据包失败
  mysql_net_buffer_length: 16384      # 网络缓冲区初始大小（字节），默认 16KB
  mysql_compress: false               # 是否启用网络传输压缩（节省带宽，增加CPU开销）
  mysql_init_command: ""              # 连接建立后执行的初始化SQL（如 "SET time_zone='+08:00'"）

  # --- 事务与隔离级别配置 ---
  mysql_isolation_level: "REPEATABLE-READ"  # 事务隔离级别：READ-UNCOMMITTED, READ-COMMITTED, REPEATABLE-READ, SERIALIZABLE
  mysql_autocommit: true              # 是否自动提交事务（false 时需手动 commit/rollback）
  mysql_lock_wait_timeout: 50000      # 行锁等待超时时间（毫秒），默认 50 秒，超时抛 Lock wait timeout 错误

# ==================== Redis 配置 ====================
redis:
  # --- 基础连接信息 ---
  host: "redis"                       # Redis 服务器主机名或IP地址
  port: 6379                          # Redis 服务端口
  password: "123456"                  # 认证密码（生产环境建议使用密钥管理）
  database: 3                         # 使用的数据库编号（0-15，默认0）

  # --- 连接池配置 ---
  pool_size: 5                        # 初始连接池大小（启动时创建）
  max_pool_size: 20                   # 最大连接数（超过将等待或拒绝）
  min_pool_size: 2                    # 最小空闲连接数（维持连接保活）
  pool_timeout_ms: 5000               # 获取连接最大等待时间（毫秒）
  pool_max_idle_time_ms: 600000       # 连接最大空闲时间（毫秒，10分钟超时回收）
  pool_test_on_borrow: true           # 借出前是否测试连接有效性
  pool_test_on_return: false          # 归还时是否测试连接有效性
  # test_while_idle: true             # （保留）空闲时是否测试（代码未使用，可选保留）

  # --- 连接超时与网络参数 ---
  connect_timeout_ms: 2000            # 建立连接超时时间（毫秒）
  socket_timeout_ms: 3000             # Socket 读写超时（毫秒）
  command_timeout_ms: 3000            # 单条命令执行超时（毫秒）
  tcp_keepalive: false                # 是否启用 TCP KeepAlive
  tcp_keepalive_idle: 60              # KeepAlive 空闲时间（秒）
  tcp_keepalive_interval: 30          # KeepAlive 探测间隔（秒）
  tcp_keepalive_count: 3              # KeepAlive 探测失败次数上限

  # --- 重连与重试机制 ---
  auto_reconnect: true                # 连接断开后是否自动重连
  max_reconnect_attempts: 3           # 最大重连尝试次数
  reconnect_interval_ms: 1000         # 重连间隔（毫秒）
  retry_attempts: 2                   # 命令失败后重试次数
  retry_delay_ms: 500                 # 命令重试间隔（毫秒）

  # --- 集群模式配置 ---
  cluster_enabled: false              # 是否启用 Redis Cluster 模式
  cluster_max_redirections: 5         # 最大重定向次数（避免无限循环）
  cluster_require_full_coverage: true # 是否要求所有哈希槽都可用才接受请求

  # --- 哨兵模式配置 ---
  sentinel_enabled: false             # 是否启用 Redis Sentinel 高可用模式
  sentinel_master_name: "mymaster"    # Sentinel 监控的主节点名称
  sentinel_password: ""               # Sentinel 认证密码（如配置了 requirepass）
  sentinel_timeout_ms: 5000           # Sentinel 连接超时（毫秒）

  # --- SSL/TLS 安全连接 ---
  use_ssl: false                      # 是否启用 SSL/TLS 加密连接
  ssl_cert_file: ""                   # 客户端证书文件路径（双向认证）
  ssl_key_file: ""                    # 客户端私钥文件路径
  ssl_ca_file: ""                     # CA 证书路径（用于验证服务端）
  ssl_verify_peer: false              # 是否验证服务端证书有效性
  ssl_ciphers: ""                     # 指定加密套件（如 "AES256-SHA"）

  # --- 性能优化配置 ---
  pipeline_size: 10                   # 管道批量操作的默认大小
  enable_pipeline: false              # 是否默认启用管道（批量命令优化）
  max_memory_policy: 0                # 内存淘汰策略（0=默认 noeviction，1=allkeys-lru...）
  compress_data: false                # 是否压缩存储的数据（节省内存，增加CPU开销）

  # --- 业务缓存 TTL 配置（非驱动层，业务层使用）---
  cache:
    default_ttl: 300                  # 默认缓存过期时间（秒）
    user_info_ttl: 300                # 用户基本信息缓存过期时间（秒）
    user_profile_ttl: 600             # 用户档案缓存过期时间（秒）
    user_preferences_ttl: 1800        # 用户偏好设置缓存过期时间（秒）

# ==================== 线程池配置 ====================
thread_pool:
  # --- 核心参数 ---
  core_size: 4                        # 核心线程数（即使空闲也会保留）
  max_size: 16                        # 最大线程数（任务堆积时可临时扩展至此数量）
  keep_alive_ms: 60000                # 非核心线程空闲存活时间（毫秒，60秒后回收）
  queue_capacity: 1024                # 任务队列容量（超过则触发拒绝策略）

  # --- 行为策略 ---
  allow_core_timeout: false           # 是否允许核心线程超时退出（false=永不退出）
  rejection_policy: "abort"           # 任务拒绝策略：abort（抛异常）, caller_runs, discard, discard_oldest
  prestart_core_threads: false        # 是否在启动时预创建所有核心线程（true=立即创建，false=按需创建）

  # --- 线程属性 ---
  thread_priority: 5                  # 线程优先级（1~10，5=正常，越高CPU调度越频繁）
  name_prefix: "user-service-"        # 线程名称前缀，便于调试和监控（如 "user-service-1"）

  # --- 监控配置 ---
  enable_monitoring: false            # 是否启用线程池运行时监控（如队列大小、活跃线程数等）
  monitoring_interval_ms: 5000        # 监控日志/指标采集间隔（毫秒，5秒）

# ==================== API网关配置 ====================
api_gateway:
  enabled: false
  url: "http://localhost:8081"
  endpoints:
    register: "/api/v1/services/register"
    unregister: "/api/v1/services/unregister"
    heartbeat: "/api/v1/services/heartbeat"
  registration:
    service_id: "user-service-001"
    service_name: "user_service"
    service_version: "1.0.0"
    health_check_url: "/api/v1/user/health"
    tags: ["user", "core", "microservice"]
    metadata:
      team: "core-services"
      maintainer: "game-microservices-team"
  heartbeat:
    interval: 30
    timeout: 5
    retry_count: 3

# ==================== 安全配置 ====================
security:
  authentication:
    enabled: true
    token_verification_url: "http://localhost:8008/api/v1/auth/validate"
    cache_tokens: true
    token_cache_ttl: 300
  rate_limiting:
    enabled: true
    requests_per_minute: 1000
    requests_per_hour: 10000
    burst_size: 100
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization", "X-Requested-With"]
    max_age: 3600

# ==================== 用户数据配置 ====================
user_data:
  validation:
    username:
      min_length: 3
      max_length: 50
      pattern: "^[a-zA-Z0-9_-]+$"
    password:
      min_length: 8
      max_length: 128
      require_uppercase: true
      require_lowercase: true
      require_numbers: true
      require_special_chars: false
    email:
      max_length: 255
      strict_validation: true
    nickname:
      min_length: 1
      max_length: 100
  defaults:
    language: "zh-CN"
    timezone: "Asia/Shanghai"
    theme: "light"
    notifications:
      email: true
      push: true
      sms: false
    session_timeout: 3600
  limits:
    max_sessions_per_user: 5
    session_cleanup_interval: 3600

# ==================== 日志配置 ====================
log:
  # --- 全局设置 ---
  level: "INFO"                       # 全局默认日志级别：TRACE, DEBUG, INFO, WARN, ERROR, FATAL
  format: "json"                      # （扩展）日志格式：text/json/console（非代码读取，供上层封装使用）
  output: "both"                      # （扩展）输出目标：console/file/both/network（非代码读取）

  # --- 控制台日志 ---
  console_enabled: true               # 是否启用控制台输出（开发调试用）
  console_pattern: "[%Y-%m-%d %H:%M:%S] [%l] [%n] %v"  # 控制台日志格式（%l=级别, %n=logger名, %v=消息）
  console_colored: true               # 是否启用彩色输出（终端支持 ANSI 转义码）
  console_level: "INFO"               # 控制台独立日志过滤级别（可比全局更宽松或更严格）
  console_flush_on_newline: true      # 每行结束后立即刷新（避免缓冲导致延迟）

  # --- 文件日志 ---
  file_enabled: true                  # 是否启用文件日志（生产环境必须）
  file_path: "/var/log/game-microservices/user-service.log"  # 日志文件路径（原 file.path → 重命名）
  file_pattern: "[%Y-%m-%d %H:%M:%S] [%l] [%n] %v"         # 文件日志格式
  file_max_size: 104857600            # 单文件最大大小（字节），原 "100MB" → 转为 100 * 1024 * 1024 = 104857600
  file_max_files: 10                  # 最多保留的历史文件数（自动轮转删除旧文件）
  file_level: "INFO"                  # 文件日志独立级别
  file_auto_flush: false              # 是否每次写入后立即刷盘（false=性能更好，true=数据安全）
  file_flush_interval_ms: 5000        # 自动刷盘间隔（毫秒），仅当 auto_flush=false 时有效
  file_rotation_policy: "size"        # 轮转策略：size（按大小）, time（按时间）
  file_rotation_time: "00:00"         # 时间轮转触发时间（HH:MM），仅 policy=time 时有效
  file.compress: true                 # （扩展）是否压缩历史日志文件（节省磁盘，非代码读取）

  # --- 网络日志（如 Syslog/TCP/UDP）---
  network_enabled: false              # 是否启用网络日志（集中式日志收集）
  network_protocol: "udp"             # 传输协议：udp/tcp/syslog
  network_host: "localhost"           # 远程日志服务器地址
  network_port: 514                   # 远程端口（syslog 默认 514）
  network_facility: "local0"          # syslog 设施类型（local0~local7, user, daemon...）
  network_level: "ERROR"              # 网络日志最低级别（通常只发错误）
  network_timeout_ms: 3000            # 网络发送超时（毫秒）
  network_retry_attempts: 3           # 发送失败重试次数

  # --- 异步日志（推荐生产环境开启）---
  async_enabled: true                 # 是否启用异步日志（避免阻塞业务线程）
  async_queue_size: 8192              # 异步队列容量（超过则根据 overflow_policy 处理）
  async_thread_count: 1               # 异步写线程数量（通常1个足够）
  async_flush_interval_ms: 1000       # 批量刷盘间隔（毫秒）
  async_overflow_policy: "block"      # 队列满时策略：block（阻塞等待）, discard（丢弃新日志）
  async_timeout_ms: 5000              # 异步操作超时时间（毫秒）

  # --- 组件级别控制（业务模块独立日志级别）---
  components:
    database: "INFO"                  # 数据库操作日志级别
    cache: "INFO"                     # 缓存操作日志级别
    http: "INFO"                      # HTTP 请求/响应日志级别
    auth: "DEBUG"                     # 认证授权相关日志（调试用）
    business: "INFO"                  # 核心业务逻辑日志级别

# ==================== 监控配置 ====================
monitoring:
  enabled: true
  metrics:
    enabled: true
    port: 9082
    path: "/metrics"
  health_check:
    enabled: true
    path: "/api/v1/user/health"
    interval: 30
    timeout: 5
  performance:
    track_requests: true
    track_database_queries: true
    track_cache_operations: true
    slow_query_threshold: 1000

# ==================== 业务配置 ====================
business:
  user_creation:
    auto_create_profile: true
    auto_create_preferences: true
    welcome_message: true
  session_management:
    max_concurrent_sessions: 5
    force_logout_on_limit: false
    notify_on_new_session: true
  profile_management:
    avatar_upload:
      enabled: true
      max_size: "5MB"
      allowed_types: ["jpg", "jpeg", "png", "gif"]
      storage_path: "/var/lib/game-microservices/avatars"
  search:
    enabled: true
    max_results: 50
    cache_results: true
    cache_ttl: 300

# ==================== 环境配置 ====================
development:
  debug_mode: true
  mock_external_services: false
  enable_cors: true
  log_all_requests: true
  database:
    show_sql: true
    log_slow_queries: true
  cache:
    disable_for_testing: false

testing:
  debug_mode: false
  database:
    use_test_db: true
    reset_data_on_start: true
  cache:
    use_memory_cache: true
  external_services:
    mock_auth_service: true

production:
  debug_mode: false
  security:
    enforce_https: true
    strict_cors: true
    enable_audit_log: true
  database:
    use_read_replicas: true
    enable_connection_pooling: true
  cache:
    enable_clustering: true
    backup_enabled: true
  monitoring:
    alert_on_errors: true
    alert_on_high_latency: true
    performance_tracking: true